name: news_blocks_ui
description: A Flutter package that contains UI components for news blocks.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  app_ui:
    path: ../app_ui
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_html: 3.0.0
  google_mobile_ads: ^7.0.0
  news_blocks:
    path: ../../api/packages/news_blocks
  path_provider_platform_interface: ^2.1.2
  platform: ^3.1.6
  plugin_platform_interface: ^2.1.8
  url_launcher: ^6.3.2
  url_launcher_platform_interface: ^2.3.2
  video_player: ^2.11.1
  video_player_platform_interface: ^6.6.0

dev_dependencies:
  build_runner: ^2.13.0
  fake_async: ^1.3.3
  flutter_gen_runner: ^5.13.0+1
  flutter_test:
    sdk: flutter
  html: ^0.15.6
  mocktail: ^1.0.4
  mocktail_image_network: ^1.2.0
  sqflite_common_ffi: ^2.4.0+2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  output: lib/src/generated/
  line_length: 80

  integrations:
    flutter_svg: true
